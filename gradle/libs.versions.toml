[versions]
agp = "9.3.1"
composeBom = "2026.06.01"
kotlin = "2.3.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.7.1"
material = "1.10.0"
activity = "1.13.0"
savedstateCompose = "1.5.0"
profileinstaller = "1.4.1"
playReview = "2.0.2"
playAppUpdate = "2.1.0"
